<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 管理后台</title>
    <link rel="stylesheet" href="/static/css/app.css">
    {% set _site = request.state.site if request.state.site is defined else {} %}
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M19 8v6"></path>
                    <path d="M22 11h-6"></path>
                </svg>
            </div>
            <h1>{{ _site.site_name if _site.site_name else '管理后台' }}</h1>
            <h2>创建管理员账号</h2>

            {% if error %}
            <div class="alert alert-error">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ admin_prefix }}/register" method="post" id="regForm">
                <div class="form-group">
                    <label for="username">用户名 <span class="field-tip">至少 3 位</span></label>
                    <input type="text" id="username" name="username" required minlength="3" autofocus autocomplete="username" placeholder="登录使用的用户名" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">密码 <span class="field-tip">至少 6 位</span></label>
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="设置一个强密码">
                </div>
                <div class="form-group">
                    <label for="password_confirm">确认密码</label>
                    <input type="password" id="password_confirm" name="password_confirm" required minlength="6" autocomplete="new-password" placeholder="再次输入密码">
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-loading>注册</button>
            </form>

            <p class="auth-link">已有账号？<a href="{{ admin_prefix }}/login">返回登录</a></p>
            <p class="auth-note">第一个注册的用户将自动成为管理员</p>
        </div>
    </div>
    <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        var p = document.getElementById('password').value;
        var c = document.getElementById('password_confirm').value;
        if (p !== c) {
            e.preventDefault();
            alert('两次密码输入不一致');
            return;
        }
        var btn = this.querySelector('[data-loading]');
        if (btn) btn.classList.add('is-loading');
    });
    </script>
</body>
</html>
