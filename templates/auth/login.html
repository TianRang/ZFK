<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('auth.login_title') }} - {{ t('auth.admin_panel') }}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    {% set _site = request.state.site if request.state.site is defined else {} %}
</head>
<body>
    <div class="lang-switch" style="position:fixed;top:14px;right:14px;z-index:99;display:flex;gap:0;background:rgba(255,255,255,.92);border:1.5px solid rgba(0,0,0,.18);border-radius:999px;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.12);font-size:.78rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1">
        <a href="/lang/zh" style="padding:.3rem .65rem;border-radius:999px;text-decoration:none;font-weight:600;{% if lang == 'zh' %}background:#1f2937;color:#fff{% else %}color:#374151{% endif %}">中文</a>
        <a href="/lang/en" style="padding:.3rem .65rem;border-radius:999px;text-decoration:none;font-weight:600;{% if lang == 'en' %}background:#1f2937;color:#fff{% else %}color:#374151{% endif %}">EN</a>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0110 0v4"></path>
                </svg>
            </div>
            <h1>{{ _site.site_name if _site.site_name else t('auth.admin_panel') }}</h1>
            <h2>{{ t('auth.login_subtitle') }}</h2>

            {% if error %}
            <div class="alert alert-error">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ admin_prefix }}/login" method="post" id="loginForm">
                <div class="form-group">
                    <label for="username">{{ t('auth.username') }}</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="{{ t('auth.username_placeholder') }}" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">{{ t('auth.password') }}</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="{{ t('auth.password_placeholder') }}">
                </div>
                <div class="form-group">
                    <label for="captcha">{{ t('front.captcha') }}</label>
                    <div class="captcha-row">
                        <input type="text" id="captcha" name="captcha" placeholder="{{ t('front.captcha_placeholder') }}" required maxlength="4" autocomplete="off">
                        <img id="captchaImg" src="{{ captcha_img }}" alt="{{ t('front.captcha') }}" onclick="refreshCaptcha()" title="{{ t('common.refresh') }}">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-loading>{{ t('auth.signin') }}</button>
            </form>

            <p class="auth-link">{{ t('auth.no_account') }}<a href="{{ admin_prefix }}/register">{{ t('auth.signup_link') }}</a></p>
        </div>
    </div>
    <script>
    function refreshCaptcha() { location.reload(); }
    document.getElementById('loginForm').addEventListener('submit', function() {
        var btn = this.querySelector('[data-loading]');
        if (btn) btn.classList.add('is-loading');
    });
    </script>
</body>
</html>
